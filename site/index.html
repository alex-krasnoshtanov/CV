<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oleksii Krasnoshtanov — Resume</title>
<link rel="canonical" href="https://alex-krasnoshtanov.github.io/CV/">
<meta name="description" content="Resume of Oleksii Krasnoshtanov — Applied Data Science &amp; AI. Computer vision, NLP, RAG systems and MLOps.">

<!-- Everything a link preview needs lives up here in the head, where it is
     invisible to a reader. LinkedIn, Slack and iMessage scrape these tags and
     never look at the body, so the page itself can be nothing but the resume.
     og:image is regenerated from page 1 on every build and cannot go stale. -->
<meta property="og:type" content="profile">
<meta property="og:url" content="https://alex-krasnoshtanov.github.io/CV/">
<meta property="og:title" content="Oleksii Krasnoshtanov — Resume">
<meta property="og:description" content="Applied Data Science &amp; AI — computer vision, NLP, RAG systems and MLOps.">
<meta property="og:image" content="https://alex-krasnoshtanov.github.io/CV/preview.png">
<meta property="og:image:width" content="1275">
<meta property="og:image:height" content="666">
<meta property="og:image:alt" content="First page of Oleksii Krasnoshtanov's resume">
<meta property="profile:first_name" content="Oleksii">
<meta property="profile:last_name" content="Krasnoshtanov">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Oleksii Krasnoshtanov — Resume">
<meta name="twitter:description" content="Applied Data Science &amp; AI — computer vision, NLP, RAG systems and MLOps.">
<meta name="twitter:image" content="https://alex-krasnoshtanov.github.io/CV/preview.png">

<meta name="theme-color" content="#e9ebea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181b" media="(prefers-color-scheme: dark)">

<style>
  :root {
    color-scheme: light dark;
    --mat: #e9ebea;          /* the surface the page sits on */
    --edge: rgba(0,0,0,.14);
    --pill-bg: rgba(28,32,34,.82);
    --pill-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --mat: #14181b;
      --edge: rgba(0,0,0,.5);
      --pill-bg: rgba(238,242,241,.9);
      --pill-ink: #12171a;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--mat); }

  /* Present but not shown: the document still has a heading for screen
     readers and for anything that reads structure rather than metadata. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Mobile first, because that is the case that cannot use a PDF viewer at
     all. iOS Safari and the in-app browsers LinkedIn opens links in refuse to
     render a PDF inside an <object> or <iframe> and paint an empty box. A
     rendered image of the page always works, looks identical to the document,
     and needs no chrome to explain itself. */
  .sheet {
    display: block;
    width: 100%;
    max-width: 60rem;
    margin: 0 auto;
    height: auto;
    background: #fff;
    box-shadow: 0 1px 12px var(--edge);
  }

  .viewer { display: none; }

  /* Desktop gets the real PDF, full bleed: selectable text, the browser's own
     download and print controls, no chrome of mine. */
  @media (min-width: 60rem) and (pointer: fine) {
    .sheet { display: none; }
    .viewer {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  }

  /* One small affordance, and only where the page is an image rather than a
     real PDF. It sits out of the way in the bottom corner and is the only
     thing on the page that is not the resume. */
  .open-pdf {
    position: fixed;
    right: 0.8rem;
    bottom: 0.8rem;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.85rem;
    border-radius: 999px;
    background: var(--pill-bg);
    color: var(--pill-ink);
    font: 500 0.82rem/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    text-decoration: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.28);
    backdrop-filter: blur(6px);
  }
  .open-pdf:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  @media (min-width: 60rem) and (pointer: fine) { .open-pdf { display: none; } }

  @media print {
    .open-pdf { display: none; }
    .sheet { box-shadow: none; max-width: none; }
  }
</style>
</head>
<body>

  <h1 class="sr-only">Oleksii Krasnoshtanov — Resume</h1>

  <img class="sheet" src="page1.png" width="1700" height="2200"
       alt="Resume of Oleksii Krasnoshtanov" fetchpriority="high">

  <iframe class="viewer" src="resume.pdf" title="Resume of Oleksii Krasnoshtanov"></iframe>

  <a class="open-pdf" href="resume.pdf">Open PDF</a>

</body>
</html>
