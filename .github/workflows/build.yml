name: Build CV and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - 'site/**'
      - '.github/workflows/build.yml'
  # Manual trigger. The paths filter above silently skips the build whenever
  # GitHub can't diff the push against the previous head — after a force-push
  # or history rewrite, for instance — which previously meant pushing an empty
  # "trigger build" commit to get a fresh PDF. This makes that a button.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: cv

      # pdftoppm renders the preview card below. Not preinstalled on the runner
      # image, and cheap enough that pinning a cache would cost more than it saves.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp cv/resume.pdf _site/resume.pdf
          cp site/index.html _site/index.html

          # page1.png is what phones actually see. Mobile browsers will not
          # render a PDF inside an <object> or <iframe>, so the page shows a
          # rendered image of the document instead of a viewer that would come
          # up blank. 200 dpi on letter paper is 1700x2200, which stays sharp
          # on a 3x screen; the <img> in index.html hardcodes those numbers to
          # reserve the space before it loads.
          pdftoppm -png -r 200 -f 1 -l 1 -singlefile cv/resume.pdf _site/page1

          # preview.png is the link card. Letter at 150 dpi is 1275px wide, so
          # a 666px crop holds the 1200x627 ratio LinkedIn and Slack crop to
          # and lands on the header plus education. Cropping inside pdftoppm
          # avoids needing ImageMagick at all.
          pdftoppm -png -r 150 -f 1 -l 1 -x 0 -y 0 -W 1275 -H 666 -singlefile cv/resume.pdf _site/preview

          # Fail the build rather than deploy a page with a broken image or a
          # card LinkedIn cannot read.
          test -s _site/page1.png
          test -s _site/preview.png
          grep -q 'og:image' _site/index.html
          python3 -c "
          import struct, sys
          for name, want in (('_site/page1.png', (1700, 2200)), ('_site/preview.png', (1275, 666))):
              w, h = struct.unpack('>II', open(name, 'rb').read()[16:24])
              print(f'{name}: {w}x{h}')
              if (w, h) != want:
                  sys.exit(f'{name} is {w}x{h}, expected {want[0]}x{want[1]} -- paper size changed?')
          "
          ls -l _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
