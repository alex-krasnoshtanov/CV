name: Build CV and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - 'site/**'
      - '.github/workflows/build.yml'
  # Manual trigger. The paths filter above silently skips the build whenever
  # GitHub can't diff the push against the previous head — after a force-push
  # or history rewrite, for instance — which previously meant pushing an empty
  # "trigger build" commit to get a fresh PDF. This makes that a button.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: cv

      # pdftoppm renders the preview card below. Not preinstalled on the runner
      # image, and cheap enough that pinning a cache would cost more than it saves.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp cv/resume.pdf _site/resume.pdf

          # The landing page is a real file in site/ rather than a heredoc, so it
          # can be edited and reviewed like anything else. BUILD_DATE is the only
          # thing CI substitutes.
          sed "s/BUILD_DATE/$(date -u '+%-d %B %Y')/" site/index.html > _site/index.html

          # Social preview: the top slice of page 1, at the 1200x627-ish ratio
          # LinkedIn and Slack crop to. Letter paper at 150 dpi is 1275px wide,
          # so 666px tall holds that ratio exactly and lands on the header plus
          # education. Cropping in pdftoppm avoids needing ImageMagick at all.
          pdftoppm -png -r 150 -f 1 -l 1 -x 0 -y 0 -W 1275 -H 666 -singlefile cv/resume.pdf _site/preview

          test -s _site/preview.png
          test -s _site/index.html
          grep -q 'og:image' _site/index.html
          ! grep -q 'BUILD_DATE' _site/index.html
          ls -l _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
